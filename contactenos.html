<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

      src="https://kit.fontawesome.com/bdc4e23805.js"
      crossorigin="anonymous"
    ></script>
</head>
<body>
    <header>
        <div class="logo">
            <h1>☕ Coffe</h1>
            </div>
             <input type="checkbox" id="menu-toggle">
                <label for="menu-toggle" class="menu-icon">
                <i class="fa-solid fa-bars"></i>
                </label>
            <nav class="nav">
                <ul>
                    <li><a href="./index.html">Home</a></li>
                    <li><a href="./menu.html">Menu</a></li>
                    <li><a href="./galeria.html">Galeria</a></li>
                    <li><a href="./contactenos.html">Contactenos</a></li>
                </ul>
            </nav>
            
        </header>
   <section id="inicio" class="inicio">
    <div class="titulo-container">
        <h1 class="titulo">CONTACT US</h1>
        <div class="linea"></div>
    </div>

    <div class="contacto-form-container">
        <div class="contacto">
            <p><i class="fa-solid fa-map-location-dot"></i> 132 Camsite avenue,wilderness,CA 98765</p>
            <p><i class="fa-solid fa-envelope"></i> info@coffeeshopwebsite.com</p>
            <p><i class="fa-solid fa-phone"></i> (123) 4456-78909</p>
            <p><i class="fa-solid fa-clock"></i> Monday-Friday: 9:00 AM - 5:PM</p>
            <p><i class="fa-solid fa-clock"></i> Saturday:10:00 AM - 3:00 PM</p>
            <p><i class="fa-solid fa-clock"></i> Sunday:Closed</p>
            <p><i class="fa-solid fa-globe"></i> www.codingneplweb.com</p>
        </div>

        <div class="formulario">
            <form action="procesar" method="post">
                <input type="text" placeholder="Your name" id="nombre" name="nombre" required>
                <input type="email" placeholder="Your email" id="correo" name="correo" required>
                <textarea id="mensaje" placeholder="Your message" name="mensaje" rows="5" required></textarea>
                <button type="submit">Enviar</button>
            </form>
        </div>
    </div>
</section>


</body>
</html>
